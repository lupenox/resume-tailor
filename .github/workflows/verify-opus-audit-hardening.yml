name: Verify Opus audit hardening

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  harden-and-test:
    if: github.head_ref == 'fix/opus-audit-hardening'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/opus-audit-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded audit hardening
        run: |
          python .github/scripts/apply_opus_audit_hardening.py
          rm -f .github/scripts/apply_opus_audit_hardening.py
          rm -f .github/workflows/verify-opus-audit-hardening.yml

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Compile source and tests
        run: python -m compileall resume_tailor tests

      - name: Run focused patch suites
        run: |
          python -m pytest \
            tests/test_gemma_patch_architecture.py \
            tests/test_gemma_evidence_contract.py \
            tests/test_ollama_writer.py \
            tests/test_revision.py

      - name: Check whitespace
        run: git diff --check

      - name: Install document rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: Run full offline suite
        run: python -m pytest

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden patch catalog and claim validation"
          git push origin HEAD:fix/opus-audit-hardening
