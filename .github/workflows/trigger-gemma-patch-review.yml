name: Diagnose Gemma patch corrections

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose-generated-source:
    if: github.head_ref == 'refactor/gemma-target-only-patches'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: refactor/gemma-target-only-patches
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded review corrections in disposable checkout
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/gemma-patch-review.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('Could not locate the embedded correction Python block')
          embedded = source.split(start_marker, 1)[1].split(end_marker, 1)[0]

          output: list[str] = []
          in_source_literal = False
          for line in embedded.splitlines():
              stripped_outer = line[10:] if line.startswith('          ') else line
              delimiter_line = stripped_outer.strip() in {"'''", "r'''"}
              if in_source_literal:
                  if delimiter_line:
                      output.append(stripped_outer)
                      in_source_literal = False
                  else:
                      output.append(line)
                  continue
              output.append(stripped_outer)
              if "r'''" in stripped_outer and not delimiter_line:
                  in_source_literal = True

          if in_source_literal:
              raise SystemExit('Unclosed source-code literal in correction script')
          Path('/tmp/apply-gemma-patch-review.py').write_text(
              '\n'.join(output).rstrip() + '\n',
              encoding='utf-8',
          )
          PY
          python /tmp/apply-gemma-patch-review.py

      - name: Show generated source around compiler failures
        if: always()
        run: |
          echo '=== patch_engine.py 175-225 ==='
          nl -ba resume_tailor/patch_engine.py | sed -n '175,225p'
          echo '=== ollama_probe.py 35-85 ==='
          nl -ba resume_tailor/ollama_probe.py | sed -n '35,85p'
          echo '=== ollama_writer.py 740-810 ==='
          nl -ba resume_tailor/ollama_writer.py | sed -n '740,810p'

      - name: Compile generated source
        run: python -m compileall resume_tailor tests
