name: Diagnose Gemma patch corrections

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose-generated-source:
    if: github.head_ref == 'refactor/gemma-target-only-patches'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: refactor/gemma-target-only-patches
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Apply bounded review corrections in disposable checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_path = Path('.github/workflows/gemma-patch-review.yml')
          workflow = yaml.safe_load(workflow_path.read_text(encoding='utf-8'))
          steps = workflow['jobs']['correct-and-test']['steps']
          correction_step = next(
              step for step in steps
              if step.get('name') == 'Apply bounded review corrections'
          )
          shell_script = correction_step['run']
          lines = shell_script.splitlines()
          start = lines.index("python - <<'PY'")
          end = lines.index('PY', start + 1)
          python_source = '\n'.join(lines[start + 1:end]).rstrip() + '\n'
          Path('/tmp/apply-gemma-patch-review.py').write_text(
              python_source,
              encoding='utf-8',
          )
          PY
          python /tmp/apply-gemma-patch-review.py

      - name: Show generated source around compiler failures
        if: always()
        run: |
          echo '=== patch_engine.py 175-225 ==='
          nl -ba resume_tailor/patch_engine.py | sed -n '175,225p'
          echo '=== ollama_probe.py 35-85 ==='
          nl -ba resume_tailor/ollama_probe.py | sed -n '35,85p'
          echo '=== ollama_writer.py 740-810 ==='
          nl -ba resume_tailor/ollama_writer.py | sed -n '740,810p'

      - name: Compile generated source
        run: python -m compileall resume_tailor tests
