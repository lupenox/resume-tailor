name: Verify Gemma patch corrections

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  correct-and-test:
    if: github.head_ref == 'refactor/gemma-target-only-patches'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: refactor/gemma-target-only-patches
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded review corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/gemma-patch-review.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('Could not locate the embedded correction Python block')
          embedded = source.split(start_marker, 1)[1].split(end_marker, 1)[0]

          output: list[str] = []
          in_source_literal = False
          for line in embedded.splitlines():
              stripped_outer = line[10:] if line.startswith('          ') else line
              delimiter_line = stripped_outer.strip() in {"'''", "r'''"}
              if in_source_literal:
                  if delimiter_line:
                      output.append(stripped_outer)
                      in_source_literal = False
                  else:
                      output.append(line)
                  continue
              output.append(stripped_outer)
              if "r'''" in stripped_outer and not delimiter_line:
                  in_source_literal = True

          if in_source_literal:
              raise SystemExit('Unclosed source-code literal in correction script')
          Path('/tmp/apply-gemma-patch-review.py').write_text(
              '\n'.join(output).rstrip() + '\n',
              encoding='utf-8',
          )
          PY
          python /tmp/apply-gemma-patch-review.py

          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected synthetic fixture text not found in {path}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          architecture_tests = Path('tests/test_gemma_patch_architecture.py')
          replace_exact(
              architecture_tests,
              '"evidence_source_ids": ["skill_groups.2"],',
              '"evidence_source_ids": ["skill_groups.2", "projects.0.bullets.0"],',
          )
          replace_exact(
              architecture_tests,
              'current_skill + ", FabricatedSkillWithoutEvidence"',
              'current_skill + ", Go"',
          )
          architecture_tests.write_text(
              architecture_tests.read_text(encoding='utf-8').rstrip() + '\n',
              encoding='utf-8',
          )

          evidence_tests = Path('tests/test_gemma_evidence_contract.py')
          replace_exact(
              evidence_tests,
              '"proposed_text": "Core Skills: Python, JavaScript, SQL",',
              '"proposed_text": f"{extracted[\'content\'][\'skill_groups\'][0][\'label\']}: Python, JavaScript, SQL",',
          )
          PY

          rm -f .github/workflows/gemma-patch-review.yml
          rm -f .github/workflows/trigger-gemma-patch-review.yml

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Compile source and tests
        run: python -m compileall resume_tailor tests

      - name: Run focused patch and revision suites
        run: |
          python -m pytest \
            tests/test_gemma_patch_architecture.py \
            tests/test_gemma_evidence_contract.py \
            tests/test_ollama_writer.py \
            tests/test_revision.py

      - name: Check whitespace
        run: git diff --check

      - name: Install document rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: Run full offline suite
        run: python -m pytest

      - name: Commit verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden deterministic Gemma patch validation"
          git push origin HEAD:refactor/gemma-target-only-patches
