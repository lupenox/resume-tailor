name: Enable Gemma patch review

on:
  push:
    branches: [refactor/gemma-target-only-patches]

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/gemma-target-only-patches
          fetch-depth: 0
      - name: Enable push verification and remove bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/gemma-patch-review.yml')
          text = target.read_text(encoding='utf-8')
          old_trigger = '''on:
  pull_request:
    branches: [main]
    types: [synchronize]
'''
          new_trigger = '''on:
  push:
    branches: [refactor/gemma-target-only-patches]
  pull_request:
    branches: [main]
    types: [synchronize]
'''
          if old_trigger not in text:
              raise SystemExit('Expected review workflow trigger was not found')
          text = text.replace(old_trigger, new_trigger, 1)
          old_if = "    if: github.head_ref == 'refactor/gemma-target-only-patches'\n"
          new_if = "    if: github.ref_name == 'refactor/gemma-target-only-patches' || github.head_ref == 'refactor/gemma-target-only-patches'\n"
          if old_if not in text:
              raise SystemExit('Expected review workflow condition was not found')
          target.write_text(text.replace(old_if, new_if, 1), encoding='utf-8')
          Path('.github/workflows/enable-gemma-patch-review.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: run one-use Gemma patch verification"
          git push origin HEAD:refactor/gemma-target-only-patches
