name: Gemma cleanup and verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup-and-test:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/gemma4-12b-writer'
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded branding cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          active_files = (
              Path('resume_tailor/utilities.py'),
              Path('resume_tailor/ui.py'),
              Path('resume_tailor/headless_render.py'),
              Path('resume_tailor/templates/run.html'),
              Path('resume_tailor/templates/dashboard.html'),
          )

          for path in active_files:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('Qwen', 'Gemma 4 12B').replace('qwen', 'gemma')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          regression = Path('tests/test_writer_branding.py')
          regression.write_text(
              '''from pathlib import Path\n\n\nACTIVE_WRITER_FILES = (\n    "resume_tailor/utilities.py",\n    "resume_tailor/ui.py",\n    "resume_tailor/headless_render.py",\n    "resume_tailor/templates/run.html",\n    "resume_tailor/templates/dashboard.html",\n)\n\n\ndef test_active_runtime_files_present_gemma_not_qwen() -> None:\n    root = Path(__file__).resolve().parents[1]\n    combined = "\\n".join(\n        (root / relative).read_text(encoding="utf-8")\n        for relative in ACTIVE_WRITER_FILES\n    )\n    assert "Gemma 4 12B" in combined\n    assert "Qwen" not in combined\n    assert "qwen" not in combined.casefold()\n''',
              encoding='utf-8',
          )

          workflow = Path('.github/workflows/gemma-cleanup.yml')
          workflow.unlink()
          PY

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Compile source and tests
        run: python -m compileall resume_tailor tests

      - name: Run offline test suite
        run: python -m pytest

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were needed."
          else
            git commit -m "fix: finish Gemma writer branding cleanup"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
